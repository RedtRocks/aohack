[project]
name = "agent-engineer"
version = "0.1.0"
description = "Frozen typed schemas for the automated-agent-engineer build."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
agent-engineer = "agent_engineer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent_engineer",
    "agent_engineer.evaluation",
    "agent_engineer.domains",
    "agent_engineer.domains.extraction",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
